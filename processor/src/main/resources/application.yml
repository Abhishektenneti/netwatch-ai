server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: netwatch-processor
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: netwatch-processor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

netwatch:
  kafka:
    topics:
      raw-events: raw-events
      processed-events: processed-events
      anomaly-events: anomaly-events
  qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_PORT:6334}
    collection: device-embeddings
    vector-size: 8
  mlflow:
    tracking-uri: ${MLFLOW_TRACKING_URI:http://localhost:5000}
    experiment-name: netwatch-anomaly-detection
  anomaly:
    # Isolation Forest parameters
    num-trees: 100
    sample-size: 256
    score-threshold: 0.6
    # Rolling window size per device
    window-size: 200
