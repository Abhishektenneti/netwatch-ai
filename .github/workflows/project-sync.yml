name: Sync Project Board on PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  sync-done:
    if: github.event.pull_request.merged == true && vars.PROJECT_NUMBER != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Move linked issues to Done
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const pattern = /(?:[Cc]loses?|[Ff]ixes?|[Rr]esolves?)\s+#(\d+)/g;
            const issueNumbers = [];
            let match;
            while ((match = pattern.exec(body)) !== null) {
              issueNumbers.push(parseInt(match[1]));
            }
            if (issueNumbers.length === 0) return;

            const projectNumber = parseInt(process.env.PROJECT_NUMBER);
            const owner = context.repo.owner;

            const projectQuery = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const { user } = await github.graphql(projectQuery, { owner, number: projectNumber });
            const project = user.projectV2;
            const statusField = project.fields.nodes.find(f => f.name === 'Status');
            const doneOption = statusField?.options.find(o => o.name === 'Done');
            if (!statusField || !doneOption) return;

            for (const issueNumber of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              const addMutation = `
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                    item { id }
                  }
                }
              `;
              const { addProjectV2ItemById } = await github.graphql(addMutation, {
                projectId: project.id,
                contentId: issue.node_id,
              });

              const updateMutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }
              `;
              await github.graphql(updateMutation, {
                projectId: project.id,
                itemId: addProjectV2ItemById.item.id,
                fieldId: statusField.id,
                optionId: doneOption.id,
              });

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: 'claude-implementing',
                });
              } catch (_) {}
            }
        env:
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
