apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  namespace: netwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      containers:
        - name: processor
          image: netwatch/processor:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: QDRANT_HOST
              value: qdrant
            - name: QDRANT_PORT
              value: "6334"
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
---
apiVersion: v1
kind: Service
metadata:
  name: processor
  namespace: netwatch
spec:
  selector:
    app: processor
  ports:
    - port: 8081
      targetPort: 8081
