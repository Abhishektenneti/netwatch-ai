apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: netwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          ports:
            - containerPort: 9092
          # TODO: Add environment variables and volume mounts
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: netwatch
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
