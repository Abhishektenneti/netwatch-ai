apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: netwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.8.4
          ports:
            - containerPort: 6333
            - containerPort: 6334
          # TODO: Add persistent volume claim
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: netwatch
spec:
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
