apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: netwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.12.1
          command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000"]
          ports:
            - containerPort: 5000
          # TODO: Add persistent volume for artifacts and DB
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: netwatch
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
