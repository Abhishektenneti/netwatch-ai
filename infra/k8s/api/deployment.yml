apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: netwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: netwatch/api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: QDRANT_HOST
              value: qdrant
            - name: QDRANT_PORT
              value: "6334"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: netwatch
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
